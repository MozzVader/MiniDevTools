# MiniDevTools — Netlify config

# HTML: nunca cachear (siempre pedir version fresca al server)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# JS y CSS: cache corto con revalidacion
# (el loader dinamico en index.html agrega ?_v=YYYYMMDD)
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
