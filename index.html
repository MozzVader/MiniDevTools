<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniDevTools - Herramientas para Developers</title>
  <meta name="description" content="Compendio de mini-herramientas para developers. Cropper, generadores CSS, formateadores y mas.">

  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Free -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="css/global.css">

  <!-- Favicon (placeholder, se reemplazara) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6E0;&#xFE0F;</text></svg>">
</head>
<body>

  <!-- BACKGROUND: CSS-only gradient mesh + subtle vertical bars -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-bars" aria-hidden="true"></div>

  <!-- APP LAYOUT: Sidebar + Main -->
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <a href="#/home" class="sidebar__brand">
          <span class="sidebar__logo"><i class="fa-solid fa-screwdriver-wrench"></i></span>
          <span class="sidebar__title">MiniDevTools</span>
        </a>
        <button class="sidebar__theme-toggle" id="theme-toggle" aria-label="Cambiar tema" data-tooltip-bottom="Cambiar tema claro/oscuro">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <!-- Search / Filter -->
      <div class="sidebar__search">
        <svg class="sidebar__search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="sidebar-search" class="sidebar__search-input" placeholder="Buscar herramientas..." autocomplete="off">
        <button class="sidebar__search-clear" id="sidebar-search-clear" type="button" aria-label="Limpiar busqueda" data-tooltip="Limpiar busqueda">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar__nav" id="sidebar-nav">
        <!-- Rendered by sidebar.js -->
      </nav>

      <!-- Mobile: overlay backdrop -->
      <div class="sidebar__backdrop" id="sidebar-backdrop"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main" id="main-content">
      <!-- Loading state -->
      <div class="loading-state" id="loading-state">
        <div class="loading-spinner"></div>
        <p>Cargando herramienta...</p>
      </div>
    </main>
  </div>

  <!-- Mobile menu toggle -->
  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Global toast element -->
  <div class="copy-toast" id="global-toast"></div>

  <!-- GLOBAL HELPERS -->
  <script>
    window.MiniDevTools = {
      toastTimer: null,
      showToast(message) {
        var toast = document.getElementById('global-toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2000);
      },

      /**
       * Copia texto al clipboard y muestra toast de confirmacion.
       * Estandar para todas las herramientas que generan codigo/datos.
       * @param {string} text - Texto a copiar
       * @param {string} [successMsg] - Mensaje del toast (default: "Copiado!")
       * @returns {Promise<boolean>} true si se copio, false si hubo error
       */
      async copyToClipboard(text, successMsg) {
        try {
          await navigator.clipboard.writeText(text);
          this.showToast(successMsg || 'Copiado al portapapeles');
          return true;
        } catch (e) {
          // Fallback para navegadores sin soporte de Clipboard API
          try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            this.showToast(successMsg || 'Copiado al portapapeles');
            return true;
          } catch (e2) {
            this.showToast('Error al copiar');
            return false;
          }
        }
      }
    };
  </script>

  <!-- APP SCRIPTS -->
  <script src="js/storage.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
